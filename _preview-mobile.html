<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mobile preview</title>
  <style>
    body { margin: 0; padding: 16px; background: #2a3038; display: flex; gap: 16px; align-items: flex-start; font-family: sans-serif; }
    figure { margin: 0; }
    figcaption { color: #cfd6df; font-size: 11px; padding: 6px 2px; }
    iframe { width: 390px; height: 844px; border: 0; border-radius: 18px; background: #f5f1e8; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  </style>
</head>
<body>
  <figure><figcaption>Trang chủ · 390px</figcaption><iframe src="index.html#/" title="Trang chủ"></iframe></figure>
  <figure><figcaption>Unit 1 · 390px</figcaption><iframe src="index.html#/unit/1" title="Unit 1"></iframe></figure>
</body>
</html>
